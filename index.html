<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hoṛ Or हो़ड़ Katha - BOSC Tech & Edu</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0969da">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Apple Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hoṛ Katha">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2881/2881031.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #f8f9fa;
            color: #1f2328;
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }
        .app-card {
            width: 100%;
            max-width: 1280px;
            height: 98vh;
            height: 98dvh;
            background: #ffffff;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #0969da;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: space-between;
            overflow-y: auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e1e4e8;
            padding-bottom: 5px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .app-main-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #0969da;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .developer-credit {
            font-size: 0.68rem;
            color: #57606a;
            font-weight: 600;
        }
        .lang-switcher-group {
            display: flex;
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            padding: 2px;
            border-radius: 50px;
            gap: 2px;
        }
        .tab-pill {
            background: transparent;
            color: #656d76;
            border: none;
            padding: 4px 10px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }
        .tab-pill.active {
            background: #0969da;
            color: #ffffff;
        }
        textarea {
            width: 100%;
            height: 75px;
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            color: #0969da;
            padding: 8px;
            font-size: 1.5rem;
            font-weight: 600;
            outline: none;
            resize: none;
            user-select: text;
        }
        textarea:focus {
            border-color: #0969da;
            box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.2);
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f6f8fa;
            padding: 4px 8px;
            border-radius: 5px;
            border: 1px solid #d0d7de;
        }
        .counter { font-size: 0.72rem; color: #656d76; font-weight: 600; }
        .btn-action {
            background: #0969da;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 600;
        }
        .btn-clear { background: #cf222e; }
        .keyboard-deck {
            background: #f6f8fa;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #d0d7de;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-x: auto;
        }
        .key-row {
            display: flex;
            gap: 2px;
            width: 100%;
            min-width: 600px;
        }
        .key {
            background: #ffffff;
            color: #1f2328;
            border: 1px solid #d0d7de;
            border-bottom: 2px solid #b0b7c0;
            border-radius: 4px;
            flex: 1;
            height: 32px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .key:active {
            background: #0969da !important;
            color: #ffffff !important;
            transform: translateY(1px);
        }
        .key-func {
            background: #eaeedf;
            font-size: 0.7rem;
            flex: 1.3;
        }
        .key-space { flex: 5; }
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .panel {
            background: #f6f8fa;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }
        .panel-title {
            width: 100%;
            font-size: 0.65rem;
            color: #656d76;
            font-weight: 700;
            text-transform: uppercase;
        }
        .key-dia {
            background: #ddf4ff;
            border: 1px solid #54a3ff;
            color: #0969da;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header-bar">
            <div>
                <div class="app-main-title">Hoṛ Or हो़ड़ Katha</div>
                <div class="developer-credit">Developed By BOSC Tech & Edu</div>
            </div>

            <div class="lang-switcher-group">
                <button id="tab-roman" class="tab-pill active" onclick="switchLanguage('roman')">Roman</button>
                <button id="tab-santali-dev" class="tab-pill" onclick="switchLanguage('santali-dev')">Santali Dev</button>
                <button id="tab-hindi-dev" class="tab-pill" onclick="switchLanguage('hindi-dev')">Hindi Dev</button>
                <button id="tab-olchiki" class="tab-pill" onclick="switchLanguage('olchiki')">Ol Chiki</button>
            </div>
        </div>

        <div>
            <textarea id="editor" placeholder="Type here..." oninput="updateCounter()"></textarea>
            <div class="action-bar">
                <div class="counter" id="char-counter">Chars: 0 | Words: 0</div>
                <div>
                    <button class="btn-action" onclick="copyText()">Copy</button>
                    <button class="btn-action btn-clear" onclick="clearText()">Clear</button>
                </div>
            </div>
        </div>

        <div class="keyboard-deck">
            <div id="keyboard" style="display:flex; flex-direction:column; gap:3px;"></div>
        </div>

        <div class="bottom-grid">
            <div class="panel">
                <div class="panel-title">Quick Modifiers</div>
                <button class="key-dia" onclick="addChar('़')">◌़</button>
                <button class="key-dia" onclick="addChar('’')">◌’</button>
                <button class="key-dia" onclick="addChar('\'')">◌'</button>
                <button class="key-dia" onclick="addChar('ᱽ')">ᱽ</button>
                <button class="key-dia" onclick="addChar('ᱷ')">ᱷ</button>
                <button class="key-dia" onclick="addChar('ᱸ')">ᱸ</button>
                <button class="key-dia" onclick="addChar('\u0301')">◌́</button>
                <button class="key-dia" onclick="addChar('\u0331')">◌̱</button>
            </div>
            <div class="panel" id="extra-panel">
                <div class="panel-title">Santali Special</div>
                <button class="key-dia" onclick="addChar('ñ')">ñ</button>
                <button class="key-dia" onclick="addChar('Ñ')">Ñ</button>
                <button class="key-dia" onclick="addChar('a̱')">a̱</button>
                <button class="key-dia" onclick="addChar('e̱')">e̱</button>
                <button class="key-dia" onclick="addChar('o̱')">o̱</button>
                <button class="key-dia" onclick="addChar('ḍ')">ḍ</button>
                <button class="key-dia" onclick="addChar('ṭ')">ṭ</button>
                <button class="key-dia" onclick="addChar('ṛ')">ṛ</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }

        const editor = document.getElementById('editor');
        const keyboard = document.getElementById('keyboard');
        const charCounter = document.getElementById('char-counter');
        let currentLayout = 'roman';

        const layouts = {
            roman: [
                ['1','2','3','4','5','6','7','8','9','0','BACKSPACE'],
                ['q','w','e','r','t','y','u','i','o','p'],
                ['a','s','d','f','g','h','j','k','l','ENTER'],
                ['z','x','c','v','b','n','m','ñ'],
                ['LANG_SWITCH', 'SPACE']
            ],
            'santali-dev': [
                ['०','१','२','३','४','५','६','७','८','९','BACKSPACE'],
                ['अ','आ','इ','ई','उ','ऊ','ए','ऐ','ओ','औ','ऑ'],
                ['क','ख','ग','घ','ङ','च','छ','ज','झ','ञ','ENTER'],
                ['ट','ठ','ड','ढ','ण','त','थ','द','ध','न'],
                ['प','फ','ब','भ','म','य','र','ल','व','स','ह'],
                ['ा','ि','ी','ु','ू','े','ै','ो','ौ','ं','़','्'],
                ['LANG_SWITCH', 'SPACE']
            ],
            'hindi-dev': [
                ['०','१','२','३','४','५','६','७','८','९','BACKSPACE'],
                ['अ','आ','इ','ई','उ','ऊ','ऋ','ए','ऐ','ओ','औ'],
                ['क','ख','ग','घ','ङ','च','छ','ज','झ','ञ','ENTER'],
                ['ट','ठ','ड','ढ','ण','त','थ','द','ध','न'],
                ['प','फ','ब','भ','म','य','र','ल','व','श','ष','स','ह'],
                ['ा','ि','ी','ु','ू','े','ै','ो','ौ','ं','ः','्'],
                ['LANG_SWITCH', 'SPACE']
            ],
            olchiki: [
                ['᱑','᱒','᱓','᱔','᱕','᱖','᱗','᱘','᱙','᱐','BACKSPACE'],
                ['ᱚ','ᱛ','ᱜ','ᱝ','ᱞ','ᱟᱹ','ᱠ','ᱡ','ᱢ','ᱣ'],
                ['ᱤ','ᱥ','ᱦ','ᱧ','ᱨ','ᱩ','ᱪ','ᱫ','ᱬ','ᱭ','ENTER'],
                ['ᱮ','ᱯ','ᱰ','ᱱ','ᱲ','ᱳ','ᱴ','ᱵ','ᱶ','ᱷ'],
                ['LANG_SWITCH', 'SPACE']
            ]
        };

        function drawKeyboard() {
            keyboard.innerHTML = '';
            const keys = layouts[currentLayout];
            keys.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'key-row';
                row.forEach(k => {
                    const btn = document.createElement('button');
                    btn.className = 'key';
                    if (k === 'BACKSPACE') {
                        btn.textContent = '⌫';
                        btn.classList.add('key-func');
                        btn.onclick = () => doBackspace();
                    } else if (k === 'SPACE') {
                        btn.textContent = 'Space';
                        btn.classList.add('key-space');
                        btn.onclick = () => addChar(' ');
                    } else if (k === 'ENTER') {
                        btn.textContent = '↵';
                        btn.classList.add('key-func');
                        btn.onclick = () => addChar('\n');
                    } else if (k === 'LANG_SWITCH') {
                        btn.textContent = '🌐 Switch';
                        btn.classList.add('key-func');
                        btn.onclick = cycleLanguage;
                    } else {
                        btn.textContent = k;
                        btn.onclick = () => addChar(k);
                    }
                    rowDiv.appendChild(btn);
                });
                keyboard.appendChild(rowDiv);
            });
        }

        function addChar(ch) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.substring(0, start) + ch + editor.value.substring(end);
            editor.setSelectionRange(start + ch.length, start + ch.length);
            editor.focus();
            updateCounter();
        }

        function doBackspace() {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            if (start === end && start > 0) {
                editor.value = editor.value.substring(0, start - 1) + editor.value.substring(end);
                editor.setSelectionRange(start - 1, start - 1);
            }
            editor.focus();
            updateCounter();
        }

        function updateCounter() {
            const text = editor.value;
            charCounter.textContent = `Chars: ${text.length} | Words: ${text.trim() ? text.trim().split(/\s+/).length : 0}`;
        }

        function copyText() {
            navigator.clipboard.writeText(editor.value);
            alert('Copied to clipboard!');
        }

        function clearText() {
            if (confirm('Clear all text?')) {
                editor.value = '';
                updateCounter();
            }
        }

        function switchLanguage(lang) {
            currentLayout = lang;
            document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + lang).classList.add('active');
            drawKeyboard();
        }

        function cycleLanguage() {
            const list = ['roman', 'santali-dev', 'hindi-dev', 'olchiki'];
            const next = list[(list.indexOf(currentLayout) + 1) % list.length];
            switchLanguage(next);
        }

        drawKeyboard();
    </script>
</body>
</html>
